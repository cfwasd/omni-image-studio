// 自动适配本地及 CI 环境的 capacitor-android 模块路径
def capacitorAndroidDir = new File('../node_modules/@capacitor/android/capacitor')
if (!capacitorAndroidDir.exists()) {
  // 查找 pnpm 虚拟存储路径
  def pnpmCapacitorDir = fileTree(dir: '../node_modules/.pnpm', include: '**/@capacitor/android/capacitor').files.find { it.isDirectory() }
  if (pnpmCapacitorDir) {
    capacitorAndroidDir = pnpmCapacitorDir
  }
}

if (capacitorAndroidDir.exists()) {
  include ':capacitor-android'
  project(':capacitor-android').projectDir = capacitorAndroidDir
}
