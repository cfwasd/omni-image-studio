name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repo)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 阶段 1: 准备 Node.js 与 Capacitor 静态工程资源
      # -----------------------------------------------------------------
      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 恢复依赖并构建 Next.js 静态输出与 Capacitor 同步
        run: |
          npm install -g pnpm@10.15.1
          pnpm install --frozen-lockfile
          # 确保 public 目录有基础资源，并执行同步
          npx cap sync android

      # -----------------------------------------------------------------
      # 阶段 2: 设置 Java 21 环境并使用标准 Gradle 构建 APK
      # -----------------------------------------------------------------
      - name: 设置 Java JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 编译输出 APK
        run: |
          cd android
          # 捕获并输出详细错误栈
          ./gradlew assembleDebug --info --stacktrace

      # -----------------------------------------------------------------
      # 阶段 3: 提取并重命名 APK 产物
      # -----------------------------------------------------------------
      - name: 提取并重命名 APK 产物
        run: |
          mkdir -p apk-output
          echo "=== 正在全盘搜索所有构建产物 .apk ==="
          find . -type f -name "*.apk"

          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "未找到编译生成的 APK 文件，尝试排查 build 目录:"
            find android/app/build/ -type f | head -n 30
            exit 1
          fi

          echo "成功命中构建安装包: $APK_FILE"
          cp "$APK_FILE" "apk-output/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk"
          ls -lh apk-output/

      - name: 发布至 GitHub Release 附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "OmniImage Studio ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apk-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
