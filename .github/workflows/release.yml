name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repo)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 恢复项目依赖与 Capacitor 资源
        run: |
          npm install -g pnpm@10.15.1
          pnpm install --frozen-lockfile
          pnpm cap sync android

      - name: 设置 Java JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Android APK (Assemble Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 提取并重命名 APK 产物
        run: |
          mkdir -p apk-output
          echo "=== 扫描所有已编译的 APK 文件 ==="
          find android/ -type f -name "*.apk"

          APK_FILE=$(find android/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "错误: 未找到编译生成的 APK 文件！"
            exit 1
          fi

          echo "找到构建 APK: $APK_FILE"
          cp "$APK_FILE" "apk-output/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk"
          ls -lh apk-output/

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "OmniImage Studio ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apk-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
