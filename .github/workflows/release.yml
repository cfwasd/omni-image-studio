name: Release & Docker Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.1.0-manual" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Docker Buildx (Set up Docker Buildx)
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像 (Build & Push GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打包轻量生产归档文件 (Package Deploy Asset)
        run: |
          zip -r omni-image-studio-deploy.zip \
            src public prisma .env.example .npmrc .dockerignore \
            Dockerfile docker-compose.yml package.json pnpm-lock.yaml \
            next.config.ts tsconfig.json postcss.config.mjs eslint.config.mjs \
            nginx.conf capacitor.config.js README.md

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "Release ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            omni-image-studio-deploy.zip
            docker-compose.yml
            .env.example
            nginx.conf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
