name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repo)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 阶段 1: 准备 Node.js 与 Capacitor 同步
      # -----------------------------------------------------------------
      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 恢复依赖并执行 Capacitor Android 同步
        run: |
          npm install -g pnpm@10.15.1
          pnpm install --frozen-lockfile
          npx cap sync android

      # -----------------------------------------------------------------
      # 阶段 2: 设置 Java 21 与 Android 环境
      # -----------------------------------------------------------------
      - name: 设置 Java JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x android/gradlew

      # -----------------------------------------------------------------
      # 阶段 3: 执行 Gradle 编译并当场提取 APK
      # -----------------------------------------------------------------
      - name: 编译并提取 APK 安装包
        run: |
          cd android
          # 明确编译主应用模块 :app
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

          mkdir -p ../apk-output
          echo "=== 检查生成的 APK 文件 ==="
          find app/build/outputs/apk/ -type f -name "*.apk" -ls

          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "未找到 APK 文件，列出整个 app/build 目录:"
            find app/build/ -type f | head -n 30
            exit 1
          fi

          cp "$APK_FILE" "../apk-output/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk"
          cd ..
          ls -lh apk-output/

      # -----------------------------------------------------------------
      # 阶段 4: 发布 GitHub Release 附件
      # -----------------------------------------------------------------
      - name: 发布至 GitHub Release 附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "OmniImage Studio ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apk-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
