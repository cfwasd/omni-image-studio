name: Release APK & Docker Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # 任务 1: 构建 Android 原生 APK 安装包并签名
  # -------------------------------------------------------------
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm 并恢复依赖 (安装 @capacitor/android 源码)
        run: |
          npm install -g pnpm@10.15.1
          pnpm install --frozen-lockfile
          pnpm cap sync android

      - name: 设置 Java JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.1.0-manual" >> $GITHUB_OUTPUT
          fi

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x android/gradlew

      - name: 执行 Gradle 构建 Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 自动签名生成安装包 (Sign Android APK)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"
        continue-on-error: true

      - name: 整理并重命名 APK 产物
        run: |
          mkdir -p build-artifacts
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" build-artifacts/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk
          fi
          echo "APK 产物已就绪:"
          ls -la build-artifacts/

      - name: 上传 APK 构件 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OmniImage-Studio-APK
          path: build-artifacts/*.apk

  # -------------------------------------------------------------
  # 任务 2: 构建 Docker 镜像与发布 GitHub Release
  # -------------------------------------------------------------
  build-docker-and-release:
    name: Build Docker & Create Release
    needs: build-apk
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v0.1.0-manual" >> $GITHUB_OUTPUT
          fi

      - name: 下载刚才构建的 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: OmniImage-Studio-APK
          path: release-assets/

      - name: 设置 Docker Buildx (Set up Docker Buildx)
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像 (Build & Push GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打包生产部署轻量文件
        run: |
          zip -r release-assets/omni-image-studio-deploy.zip \
            src public prisma .env.example .npmrc .dockerignore \
            Dockerfile docker-compose.yml package.json pnpm-lock.yaml \
            next.config.ts tsconfig.json postcss.config.mjs eslint.config.mjs \
            nginx.conf capacitor.config.js README.md
          cp docker-compose.yml release-assets/
          cp .env.example release-assets/
          cp nginx.conf release-assets/

      - name: 创建 GitHub Release 并挂载 APK 与 Docker 配置文件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "OmniImage Studio ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/omni-image-studio-deploy.zip
            release-assets/docker-compose.yml
            release-assets/.env.example
            release-assets/nginx.conf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
