name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码 (Checkout repo)
        uses: actions/checkout@v4

      - name: 提取版本号 (Extract Tag Name)
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # 阶段 1: 准备 Node.js 与 Capacitor Android
      # -----------------------------------------------------------------
      - name: 设置 Node.js 22 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 恢复依赖并执行 Capacitor Android 同步
        run: |
          npm install -g pnpm@10.15.1
          pnpm install --no-frozen-lockfile
          npx cap sync android

      # -----------------------------------------------------------------
      # 阶段 2: 设置 Java 21 环境并构建 Android APK
      # -----------------------------------------------------------------
      - name: 设置 Java JDK 21 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x android/gradlew

      - name: 编译并生成 APK (同时触发 assembleDebug 与 assembleRelease)
        run: |
          cd android
          # 明确指定当前 app 模块编译 Debug 与 Release
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      # -----------------------------------------------------------------
      # 阶段 3: 全局递归提取 APK 产物并直接发布 GitHub Release
      # -----------------------------------------------------------------
      - name: 提取并重命名 APK 产物
        run: |
          mkdir -p apk-output
          echo "=== 正在全盘搜索所有构建产物 .apk ==="
          find . -type f -name "*.apk" -ls

          # 提取找到的第一个有效 APK 文件
          APK_FOUND=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "警告: 未检测到 apk 后缀，列出 build 目录所有文件排查:"
            find android/app/build/ -type f | head -n 30
            exit 1
          fi

          echo "成功命中构建安装包: $APK_FOUND"
          cp "$APK_FOUND" "apk-output/OmniImage-Studio-${{ steps.meta.outputs.VERSION }}.apk"
          ls -lh apk-output/

      - name: 发布至 GitHub Release 附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.meta.outputs.VERSION }}
          name: "OmniImage Studio ${{ steps.meta.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: apk-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
