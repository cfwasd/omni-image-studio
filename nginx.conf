# ================================================================
# OmniImage Studio (全象生图) - 生产级 Nginx 反向代理配置模板
# ================================================================

# 1. HTTP 自动重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name image.wangziheng.vip; # 请修改为您自己的域名或服务器公网 IP

    # ACME-challenge 证书签发目录 (Let's Encrypt / Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 核心代理配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name image.wangziheng.vip; # 请修改为您自己的域名

    # SSL 证书路径 (按实际服务器证书位置填写)
    ssl_certificate /etc/nginx/ssl/image.wangziheng.vip.crt;
    ssl_certificate_key /etc/nginx/ssl/image.wangziheng.vip.key;

    # SSL 安全参数优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 生图与上传大图限制（允许上传最高 50MB 原图/底图）
    client_max_body_size 50M;

    # 静态资源长期缓存与直出 (Next.js 静态文件)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 核心服务反向代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 与流式响应支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 真实客户端信息透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # AI 渲染长请求超时控制 (生图可能需要 30~180 秒，防止 504 Gateway Timeout)
        proxy_connect_timeout 180s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 禁用缓冲以保证 LLM 流式输出即时到达
        proxy_buffering off;
    }
}
