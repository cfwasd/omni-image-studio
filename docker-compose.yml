version: '3.8'

services:
  omni-image-studio:
    # 优先使用 GitHub Actions 自动编译推送的云端镜像 (请将 <owner>/<repo> 替换为您的 GitHub 仓库名)
    # 例如：ghcr.io/wangziheng/omni-image-studio:latest
    image: ${DOCKER_IMAGE:-omni-image-studio:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-image-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # 传入手头的 PG 数据库连接串
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-omni-image-studio-super-secret-key-2026}
      # 传入手头的 RustFS / 对象存储配置
      - OSS_REGION=${OSS_REGION:-us-east-1}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-https://s3.wangziheng.vip}
      - OSS_BUCKET=${OSS_BUCKET:-omni}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_CDN_DOMAIN=${OSS_CDN_DOMAIN}
      # 传入 LLM 扩写配置
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    extra_hosts:
      - "host.docker.internal:host-gateway"
